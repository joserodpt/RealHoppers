    Close:
      Name: "&cClose"
      Description:
        - "&fClick here to close this hopper."
    Picker:
      Next:
        Name: "&aNext page"
      Back:
        Name: "&ePrevious page"
      Search:
        Name: "&bSearch"
      Pick:
        Name: "&f%material%"
      Next-Description:
        - "&7Go forward one page."
      Back-Description:
        - "&7Go back one page."
      Pick-Description:
        - "&7Click to choose this."
    Filter:
      Add:
        Name: "&aAdd the item you are holding"
      Pick:
        Name: "&bPick a material"
      Pick-Description:
        - "&fBrowse every material and choose one."
      Empty:
        Name: "&eThis filter is empty"
      Add-Description:
        - "&fHold an item and click to add it."
      Empty-Description:
        - "&7An empty filter keeps everything."
        - "&7Add something to narrow it down."
      Entry-Description:
        - ""
        - "&7Click to &cremove&7."
    Xp:
      Name: "&aCollect &a%value% experience"
      Description:
        - "&fClick here to take this hopper's experience."
    Back:
      Name: "&eGo Back"
    Trait:
      Active-Description:
        - "&aActive"
        - ""
        - "&7Click to &cremove&7."
      Inactive-Description:
        - "&8Not active"
        - ""
        - "&7Click to &aadd&7."
      Permission-Description:
        - ""
        - "&aYou have permission to add this trait."
      No-Permission-Description:
        - ""
        - "&cYou don't have permission to add this trait."
      Needs-Link-Description:
        - ""
        - "&cThis hopper is not linked."
        - "&7Hold a stick, right-click this"
        - "&7hopper, then its destination."
      Tier-Description:
        - ""
        - "&7Tier: &b%value%"
        - "&7Next tier: &e%money%"
        - "&7Right-click to upgrade."
      Tier-Max-Description:
        - ""
        - "&7Tier: &b%value% &8(max)"
      Filter-Description:
        - "&7Shift-click to choose what it keeps."
      Unavailable-Description:
        - "&7Not available in this version."
    Hopper:
      Name: "&dHopper"
      Balance: "&fBalance: &e%money%"
      Link: "&fLinked to: &b%value%"
      Xp: "&fExperience: &a%value%"
      Traits-Header: "&f&nHopper traits:"
      No-Traits: " &7None."
      Trait-Entry: "&7- &f%trait% &8(tier %value%)"
      Collect: "&fClick here to collect hopper's balance."
      Owner: "&fOwner: &b%player%"
      Access: "&fAccess: %value%"
    Owner:
      Name: "&fOwned by &b%player%"
      # %value% is the access, %whitelisted% how many players are on the whitelist.
      Description:
        - "&fAccess: %value%"
        - "&fWhitelisted players: &b%whitelisted%"
    Rename:
      Name: "&fName: &d%name%"
      Description:
        - "&7Click to rename this hopper."
    # shown under the owner's head to those who can manage the hopper, which is what switches it
    Access:
      Public-Description:
        - "&7Anyone can open this hopper."
        - ""
        - "&7Click to make it &cprivate&7."
      Private-Description:
        - "&7Only you and your whitelist"
        - "&7can open, break or link it."
        - ""
        - "&7Click to make it &apublic&7."
    Whitelist:
      Name: "&fWhitelist &7(%value%)"
      Description:
        - "&7Players allowed into this"
        - "&7hopper while it is private."
        - ""
        - "&7Click to edit."
      Add:
        Name: "&aAdd a player"
        Description:
          - "&7Click, then type their name in chat."
      Entry:
        Name: "&b%player%"
        Description:
          - "&7Click to &cremove&7."
      Empty:
        Name: "&eNobody is whitelisted"
        Description:
          - "&7Only the owner can use this"
          - "&7hopper while it is private."

System:
  # The two title lines shown while the plugin is waiting for something to be typed in chat.
  Type-Input:
    - "&6Type in the chat"
    - "&fwhat you want to search for. &7Type 'cancel' to cancel."
  Input-Cancelled: "&cInput cancelled."
  Error-Occurred: "&cAn error occurred."
  Nothing-Found: "&cNothing found for that search."
  Reloaded: "&aReloaded!"
  Player-Only: "&cCommand can't be used in the console!"
  Vault-Missing: "&cVault is not installed on this server."
  Error-Permission: "&cYou don't have permission to execute this command!"
  Error-Command: "&cThe command you're trying to use doesn't exist."
  Error-Usage: "&cWrong usage for the command!"

# What each trait does, shown on its icon in the Traits screen.
Trait-Descriptions:
  TELEPORT:
    - "&7Sends a player who steps on the"
    - "&7hopper to the hopper it is linked to."
  ITEM_TRANSF:
    - "&7Hands its contents to the hopper"
    - "&7it is linked to, a few at a time."
  AUTO_SELL:
    - "&7Sells whatever will not fit,"
    - "&7into a balance you collect."
  AUTO_SMELT:
    - "&7Smelts what comes in. Cobblestone"
    - "&7lands as stone, ore as ingots."
  SUCTION:
    - "&7Pulls in dropped items"
    - "&7from the ground nearby."
  BLOCK_BREAKING:
    - "&7Breaks the blocks above it"
    - "&7and keeps what they drop."
  KILL_MOB:
    - "&7Hurts living things standing on"
    - "&7it and claims what they drop."
  VOID:
    - "&7Destroys whatever will not fit,"
    - "&7instead of dropping it."
  MOB_PULL:
    - "&7Drags living things nearby onto"
    - "&7the hopper. Pair it with Mob Killing."
  HARVEST:
    - "&7Cuts fully grown crops around"
    - "&7it and replants them."
  GROW:
    - "&7Grows the crops around it,"
    - "&7the way bonemeal would."
  AUTO_COMPACT:
    - "&7Squashes what it holds. Nine ingots"
    - "&7become a block, nine nuggets an ingot."
  XP_COLLECT:
    - "&7Soaks up experience orbs nearby"
    - "&7and keeps them until you collect."
  FILTER:
    - "&7Decides what the hopper may keep."
    - "&7An empty filter keeps everything."

