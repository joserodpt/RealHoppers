Hoppers:
  Teleported: "&fYou have been teleported!"
  Removed: "&fYou removed this special hopper."
  Balance-Collected: "&fYou collected &e%money% &ffrom this hopper."
  Xp-Collected: "&fYou collected &a%value% experience &ffrom this hopper."
  Balance-Collected-On-Break: "&fYou collected &e%money% &ffrom the hopper you broke."
  Not-Looking-At: "&cYou are not looking at a hopper."
  Placed: "&fYou placed &d%name%&f. It is %value%&f."
  Unknown-Owner: "&7Nobody"
  Access:
    Names:
      PUBLIC: "&apublic"
      PRIVATE: "&cprivate"
    Denied: "&c%name% &cis private. Only &f%player% &cand the players they allow can open it."
    No-Break: "&c%name% &cis private. You can't break it."
    No-Link: "&c%name% &cis private. You can't link it."
    No-Manage: "&cOnly this hopper's owner can do that."
    Set: "&d%name% &fis now %value%&f."
  Name:
    # The two title lines shown while waiting for the new name.
    Prompt:
      - "&6Type in the chat"
      - "&fthe hopper's new name. &7Type 'cancel' to cancel."
    Set: "&fThis hopper is now called &d%name%&f."
    Too-Long: "&cThat name is too long. The most is &e%value% &ccharacters."
    Empty: "&cA hopper's name can't be empty."
  Whitelist:
    # The two title lines shown while waiting for a player's name.
    Prompt:
      - "&6Type in the chat"
      - "&fthe player to allow. &7Type 'cancel' to cancel."
    Added: "&b%player% &fcan now use &d%name%&f."
    Removed: "&b%player% &fcan no longer use &d%name%&f."
    Already: "&c%player% is already on this hopper's whitelist."
    Not-On: "&c%player% isn't on this hopper's whitelist."
    Not-Found: "&cNo player called %player% has played here."
    Full: "&cThis hopper's whitelist is full. The most is &e%value%&c."
    Is-Owner: "&cThe owner can always use their own hopper."
    Empty: "&7Nobody"
    List-Header: "&d%name% &fwhitelist &7(%value%)&f:"
    List-Entry: " &7- &b%player%"
  Info:
    Header: "&d%name%"
    Owner: " &fOwner: &b%player%"
    Access: " &fAccess: %value%"
    Location: " &fLocation: &b%value%"
    Whitelist: " &fWhitelist: &b%value%"
  List:
    Header: "&b%player% &fowns &e%value% &fhoppers:"
    Entry: " &7- &d%name% &7at &f%value%"
    Empty: "&c%player% doesn't own any hoppers."
    Player-Not-Found: "&cNo player called %player% has played here."
  Traits:
    Added: "&fGave this hopper the %trait% &ftrait."
    Already-Present: "&cThis hopper already has the %trait% &ctrait."
    Needs-Link: "&eThe %trait% &etrait follows this hopper's link, and it has none yet. Hold a stick, right-click this hopper, then the one it should point at."
    Unavailable: "&cThe %trait% &ctrait is not available yet."
    No-Permission: "&cYou don't have permission to add the %trait% &ctrait."
    Removed: "&fRemoved the %trait% &ftrait from this hopper."
    Tier-Set: "&f%trait% &fis now tier &b%value%&f."
    Tier-Upgraded: "&f%trait% &fupgraded to tier &b%value%&f."
    Tier-Max: "&e%trait% &eis already at its highest tier."
    Tier-Too-Expensive: "&cThat upgrade costs &e%money%&c, which you cannot afford."
    Not-Scalable: "&cThe %trait% &ctrait has no tiers."
  Filter:
    Added: "&fThe filter now keeps &b%material%&f."
    Removed: "&fThe filter no longer keeps &b%material%&f."
    Already-Listed: "&c%material% is already in this filter."
    Nothing-Held: "&cHold the item you want the hopper to keep, then click."
  Link:
    Source-Selected: "&fSource hopper selected. Right-click the hopper it should point at."
    Same-Hopper: "&cA hopper cannot be linked to itself."
    Done: "&aHoppers linked. Teleport and Item Transfer both follow this link."
    Cancelled: "&cLinking cancelled."

GUI:
  Title: "&8%name%"
  Whitelist-Title: "&8%name% &8- Whitelist"
  Filter-Title: "&8Hopper Filter"
  Picker-Title: "&8Pick a material"
